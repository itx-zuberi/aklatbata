<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makipag-ugnayan | AklatBata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pg px-4"><div class="max-w-5xl mx-auto">
<h1 class="fd text-4xl font-extrabold text-[#1B4332] flex items-center gap-3"><span id="mm" class="w-12 flt"></span>Makipag-ugnayan</h1>
<div class="grid md:grid-cols-2 gap-6 mt-6">
<div class="grid gap-4 content-start">
<div class="card p-5 flex gap-4"><i data-lucide="map-pin" class="text-[#F59E0B] shrink-0"></i><div><b>Lokasyon</b><p class="text-sm">Barangay Masaya, Lungsod ng Kuwento, Pilipinas</p></div></div>
<div class="card p-5 flex gap-4"><i data-lucide="clock" class="text-[#F59E0B] shrink-0"></i><div><b>Oras ng Bukas</b><p class="text-sm">Lunes hanggang Biyernes: 9:00 n.u. hanggang 6:00 n.h.<br>Sabado: 9:00 n.u. hanggang 4:00 n.h.<br>Linggo: sarado</p></div></div>
<div class="card p-5 flex gap-4"><i data-lucide="phone" class="text-[#F59E0B] shrink-0"></i><div><b>Telepono at Email</b><p class="text-sm">0912-345-6789<br>kumusta@aklatbata.com</p></div></div></div>
<form id="f" class="card p-6 grid gap-3 bg-[#EBF7FC]"><h2 class="fd text-2xl font-extrabold text-[#1B4332]">Sumulat sa Amin</h2>
<label class="text-sm font-bold">Pangalan<input class="inp mt-1" required></label><label class="text-sm font-bold">Email<input type="email" class="inp mt-1" required></label>
<label class="text-sm font-bold">Paksa<select class="inp mt-1"><option>Tanong tungkol sa libro</option><option>Tungkol sa order</option><option>Iba pa</option></select></label>
<label class="text-sm font-bold">Mensahe<textarea class="inp mt-1" rows="4" required></textarea></label><button class="btn o !py-3">Ipadala ang Mensahe</button></form></div>
<h2 class="fd text-3xl font-extrabold text-[#1B4332] mt-12 mb-4">Mga Madalas Itanong</h2>
<div class="grid gap-3" id="fq"></div></div></main>
<script src="app.js"></script>
<script>
const Q=[['Paano ako mag-oorder?','Idagdag ang aklat sa iyong cart, pindutin ang Mag-checkout, at punan ang iyong detalye.'],['Gaano katagal bago dumating ang order?','Karaniwang tatlo hanggang pitong araw ng trabaho, depende sa iyong lugar.'],['Maaari bang ibalik ang aklat?','Oo, sa loob ng pitong araw kung buo pa ang aklat at may resibo.'],['Anong edad ang angkop sa mga aklat?','May nakalagay na edad sa bawat aklat, tulad ng Edad 4-7, para madali kang makapili.']];
function pageInit(){$('#mm').innerHTML=mascot('crab');
$('#fq').innerHTML=Q.map(q=>`<details class="card p-5 group"><summary class="font-bold cursor-pointer flex justify-between items-center">${q[0]}<i data-lucide="chevron-down"></i></summary><p class="mt-2 text-sm">${q[1]}</p></details>`).join('');
$('#f').onsubmit=e=>{e.preventDefault();e.target.reset();mo(`<div class="text-center"><div class="w-20 mx-auto">${mascot('panda')}</div><h3 class="fd text-2xl font-extrabold text-[#1B4332] my-2">Salamat sa iyong mensahe!</h3><p>Natanggap na namin ito at sasagot kami sa loob ng isang araw ng trabaho.</p><button class="btn g mt-4" onclick="mc()">Sige</button></div>`)}}
</script>
</body>
</html>
