<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | AklatBata</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-admin="1">
<div id="lg" class="min-h-screen grid place-items-center p-4 bg-gradient-to-b from-[#EBF7FC] to-[#FDFBF7]"><form onsubmit="login(event)" class="card p-8 w-full max-w-sm grid gap-3"><div class="w-24 mx-auto flt" id="lm"></div><h1 class="fd text-3xl font-extrabold text-[#1B4332] text-center">Pag-login ng Admin</h1>
<input id="le" type="email" required class="inp" placeholder="Email" aria-label="Email"><input id="lp" type="password" required class="inp" placeholder="Password" aria-label="Password"><p id="lerr" class="text-red-600 text-sm"></p>
<button class="btn g !py-3">Mag-login</button><button type="button" class="btn o !py-3" onclick="$('#le').value='admin@aklatbata.com';$('#lp').value='admin123'">Demo Admin Login</button><a href="index.html" class="text-center text-sm underline">Bumalik sa Tindahan</a></form></div>
<div id="ap" class="hidden"><div class="md:flex min-h-screen">
<aside class="asd md:w-72 p-4 shrink-0 md:sticky md:top-0 md:h-screen md:overflow-auto flex flex-col">
<div class="flex items-center gap-3 mb-4"><span class="w-12 bg-white rounded-2xl p-1 border-[3px] border-[#1f2937]" id="am1"></span><div><div class="fd text-2xl leading-none">AklatBata</div><div class="text-xs opacity-80">Panel ng Administrador</div></div></div>
<nav id="side" class="flex md:grid gap-2 overflow-x-auto md:content-start pb-2"></nav>
<div class="mt-auto grid gap-2 pt-3"><a class="btn o" href="index.html"><i data-lucide="arrow-left"></i> Bumalik sa Tindahan</a><button class="btn w" onclick="sessionStorage.removeItem('ab_admin');location.reload()"><i data-lucide="log-out"></i> Mag-logout</button></div></aside>
<div class="flex-1 min-w-0"><header class="sticky top-0 z-20 flex items-center justify-between gap-3 px-4 md:px-8 py-3 bg-[#FDFBF7]/95 backdrop-blur border-b-[3px] border-[#1f2937]"><div><h1 id="ttl" class="fd text-2xl md:text-3xl text-[#1B4332]"></h1><p id="dt" class="text-xs"></p></div><div class="flex items-center gap-3"><span class="relative btn w !p-2" aria-label="Mga abiso"><i data-lucide="bell"></i><span id="bell" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold min-w-5 h-5 rounded-full grid place-items-center border-2 border-[#1f2937]"></span></span><span class="w-11 h-11 rounded-full bg-[#F59E0B] border-[3px] border-[#1f2937] grid place-items-center fd">AD</span></div></header><section id="am" class="p-4 md:p-8"></section></div></div></div>
<div id="mo" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/50 p-4" onclick="if(event.target==this)mc()"><div id="mb" class="bg-[#FDFBF7] rounded-3xl max-w-lg w-full max-h-[90vh] overflow-auto p-6"></div></div>
<div id="tt" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] bg-[#104c42] text-white px-5 py-3 rounded-full text-sm font-bold opacity-0 pointer-events-none transition-opacity" role="status"></div>
<style>.asd{background:#1B4332 radial-gradient(#2D6A4F 2px,transparent 2.5px) 0 0/20px 20px;color:#fff;border-right:4px solid #1f2937}
.nvb{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;border:3px solid transparent;background:transparent;color:#d8f3dc;font:600 15px "Fredoka",var(--b);cursor:pointer;white-space:nowrap;text-align:left}
.nvb:hover{background:#ffffff22}.nvb.on{background:#fff;color:#1f2937;border-color:#1f2937;box-shadow:3px 3px 0 #1f2937}
.nvi{width:32px;height:32px;border-radius:10px;border:2px solid #1f2937;display:grid;place-items:center;color:#1f2937}.nvi svg{width:18px;height:18px}
table{border-collapse:separate;border-spacing:0}th{background:#FEF3C7;font:600 13px "Fredoka",var(--b);padding:10px;text-align:left;white-space:nowrap}td{padding:10px;border-top:2px dashed #e5d9b6;white-space:nowrap;font-size:14px}tbody tr:hover{background:#fffbeb}
.pl2{display:inline-block;padding:2px 10px;border:2px solid #1f2937;border-radius:99px;font-size:12px;font-weight:700}
.ib{width:34px;height:34px;border:3px solid #1f2937;border-radius:12px;background:#fff;display:inline-grid;place-items:center;cursor:pointer;box-shadow:2px 2px 0 #1f2937}.ib:hover{background:#FDE68A}.ib.dl{background:#fecaca}
.ib svg{width:16px;height:16px}.ic2{width:46px;height:46px;border:3px solid #1f2937;border-radius:16px;display:grid;place-items:center;background:#fff}</style>
<script src="app.js"></script>
<script>
let tab='buod',AS='',uid=Math.max(100,...books.map(b=>b.id));
const SO=[{id:'AB-1001',c:'Ana Garcia',t:589,s:'Naihatid'},{id:'AB-1002',c:'Pedro Ramos',t:420,s:'Naipadala'},{id:'AB-1003',c:'Liza Cruz',t:775,s:'Bago'},{id:'AB-1004',c:'Jose Mendoza',t:260,s:'Bago'}];
const CU=[['Ana Garcia','ana@email.com',3],['Pedro Ramos','pedro@email.com',1],['Liza Cruz','liza@email.com',5],['Jose Mendoza','jose@email.com',2],['Maria Lopez','maria@email.com',4]];
const T=[['buod','layout-dashboard','Buod ng Dashboard'],['libro','book-open','Pamamahala ng Libro'],['kat','folder','Mga Kategorya'],['order','package','Mga Order'],['cust','users','Mga Customer'],['web','globe','Nilalaman ng Website']];
const hd=(t,x='')=>`<div class="flex justify-between items-center mb-4 flex-wrap gap-2"><h1 class="fd text-3xl font-extrabold text-[#1B4332]">${t}</h1>${x}</div>`;
const tbl=(h,r)=>`<div class="card p-3 overflow-x-auto"><table class="w-full text-sm"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r}</tbody></table></div>`;
function login(e){e.preventDefault();if($('#le').value=='admin@aklatbata.com'&&$('#lp').value=='admin123'){sessionStorage.setItem('ab_admin','1');show()}else $('#lerr').textContent='Mali ang email o password. Subukan muli.'}
function show(){$('#lg').classList.add('hidden');$('#ap').classList.remove('hidden');radm()}
function pageInit(){$('#lm').innerHTML=mascot('panda');$('#am1').innerHTML=mascot('panda');if(sessionStorage.getItem('ab_admin')=='1')show()}
const NV=[['buod','layout-dashboard','Buod ng Dashboard','#FBBF24'],['libro','book-open','Pamamahala ng Libro','#38BDF8'],['kat','folder','Mga Kategorya','#F472B6'],['order','package','Mga Order','#4ADE80'],['cust','users','Mga Customer','#A78BFA'],['web','globe','Nilalaman ng Website','#FB923C']];
let CF='',OF='';const PAL=['#F59E0B','#38BDF8','#F472B6','#4ADE80','#A78BFA','#FB923C'];
const sold=b=>(b.id*37)%60+20,pill=s=>`<span class="pl2 ${{Bago:'bg-amber-200',Naipadala:'bg-sky-200',Naihatid:'bg-green-200'}[s]}">${s}</span>`;
function radm(){const od=ld('ab_orders',SO),nw=od.filter(o=>o.s=='Bago').length,cur=NV.find(n=>n[0]==tab);
$('#side').innerHTML=NV.map(n=>`<button class="nvb ${tab==n[0]?'on':''}" onclick="tab='${n[0]}';radm()"><span class="nvi" style="background:${n[3]}">${ic(n[1])}</span>${n[2]}</button>`).join('');
$('#ttl').textContent=cur[2];$('#dt').textContent=new Date().toLocaleDateString('fil-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('#bell').textContent=nw;
$('#am').innerHTML=({buod:dash,libro:bk,kat:kt,order:ord,cust:cs,web:wb}[tab])(od,nw);
if(tab=='libro')rtb();ri();
document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,p=e.dataset.p||'',o={v:0};e.textContent=p+n.toLocaleString();window.gsap&&gsap.to(o,{v:n,duration:1,onUpdate:()=>e.textContent=p+Math.round(o.v).toLocaleString()})});
window.gsap&&gsap.from('#am .card',{y:18,opacity:0,duration:.45,stagger:.06,clearProps:'all'})}
function dash(od,nw){const sales=od.reduce((s,o)=>s+o.t,0)+48250,v=[32,45,38,60,52,78],l=['Ene','Peb','Mar','Abr','May','Hun'];
const st=[['Kabuuang Benta',sales,'banknote','#FDE68A','+18%','฿'],['Bilang ng Libro',books.length,'book-open','#BAE6FD','+3',''],['Mga Bagong Order',nw,'shopping-bag','#FBCFE8','+5',''],['Aktibong Customer',CU.length+120,'users','#BBF7D0','+9%','']];
let a=0;const tot=Math.max(books.length,1),cg=cats.map((c,i)=>{const n=books.filter(b=>b.c==c.n).length/tot*100,s=`${PAL[i%6]} ${a}% ${a+n}%`;a+=n;return s}).join(',')||'#ddd 0 100%';
return `<div class="card p-6 mb-6 flex items-center gap-5 flex-wrap" style="background:linear-gradient(120deg,#FDE68A,#FDBA74)"><span class="w-24 flt">${mascot('panda')}</span><div class="flex-1 min-w-52"><h2 class="fd text-2xl">Maligayang pagbabalik, Admin!</h2><p class="font-semibold">May ${nw} bagong order na naghihintay sa iyo ngayon.</p></div><div class="flex gap-2 flex-wrap"><button class="btn g" onclick="bform()">${ic('plus')} Magdagdag ng Libro</button><button class="btn w" onclick="tab='order';radm()">Tingnan ang mga Order</button></div></div>
<div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${st.map(s=>`<div class="card p-5" style="background:${s[3]}"><div class="flex justify-between"><span class="ic2">${ic(s[2])}</span><span class="pl2 bg-white h-fit">${s[4]}</span></div><div class="fd text-3xl mt-3" data-n="${s[1]}" data-p="${s[5]}"></div><div class="text-sm font-bold">${s[0]}</div></div>`).join('')}</div>
<div class="grid lg:grid-cols-3 gap-4 mt-6"><div class="card p-5 lg:col-span-2 bg-white"><h3 class="fd text-xl">Benta kada Buwan (libong ฿)</h3><div class="flex items-end gap-3 h-52 mt-4">${v.map((x,i)=>`<div class="flex-1 text-center text-xs font-bold" title="${x} libong ฿">${x}<div class="rounded-t-2xl border-[3px] border-[#1f2937]" style="height:${x*2}px;background:linear-gradient(${PAL[i%6]},#fff8)"></div>${l[i]}</div>`).join('')}</div></div>
<div class="card p-5 bg-white"><h3 class="fd text-xl">Mga Libro kada Kategorya</h3><div class="mx-auto my-4 w-40 h-40 rounded-full border-[3px] border-[#1f2937] grid place-items-center" style="background:conic-gradient(${cg})"><div class="w-24 h-24 rounded-full bg-white border-[3px] border-[#1f2937] grid place-items-center fd text-2xl">${books.length}</div></div>${cats.map((c,i)=>`<div class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full border-2 border-[#1f2937]" style="background:${PAL[i%6]}"></span>${c.n} (${books.filter(b=>b.c==c.n).length})</div>`).join('')}</div></div>
<div class="grid lg:grid-cols-2 gap-4 mt-6"><div class="card p-5 bg-white"><h3 class="fd text-xl mb-3">Pinakamabentang mga Libro</h3><div class="grid gap-3">${[...books].sort((x,y)=>sold(y)-sold(x)).slice(0,4).map(b=>`<div class="flex items-center gap-3"><img src="${b.img}" alt="" class="w-10 h-14 object-cover rounded border-2 border-[#1f2937] bg-[#2D6A4F]" onerror="this.style.visibility='hidden'"><div class="flex-1 text-sm font-bold">${b.t}<div class="h-3 rounded-full border-2 border-[#1f2937] bg-[#fef3c7] mt-1"><div class="h-full rounded-full bg-[#F59E0B]" style="width:${sold(b)}%"></div></div></div><b>${sold(b)}</b></div>`).join('')}</div></div>
<div class="card p-5 bg-white"><h3 class="fd text-xl mb-3">Kamakailang mga Order</h3><div class="grid gap-3">${od.slice(0,4).map(o=>`<div class="flex items-center gap-3 text-sm"><span class="ic2 !w-10 !h-10 bg-[#EBF7FC]">${ic('package')}</span><div class="flex-1"><b>${o.c}</b><div class="opacity-70">#${o.id}</div></div><b>${php(o.t)}</b>${pill(o.s)}</div>`).join('')}</div></div></div>`}
function bk(){return `<div class="card p-4 mb-4 flex flex-wrap gap-3 items-center bg-white"><input class="inp !w-60" placeholder="Maghanap sa talaan..." aria-label="Maghanap" oninput="AS=this.value;rtb()"><select class="inp !w-56" aria-label="Kategorya" onchange="CF=this.value;rtb()"><option value="">Lahat ng kategorya</option>${cats.map(c=>`<option ${c.n==CF?'selected':''}>${c.n}</option>`).join('')}</select><span id="bc" class="pl2 bg-amber-200"></span><button class="btn g ml-auto" onclick="bform()">${ic('plus')} Magdagdag ng Libro</button></div><div class="card p-2 overflow-x-auto bg-white"><table class="w-full"><thead><tr><th>Pabalat</th><th>Pamagat</th><th>May-akda</th><th>Kategorya</th><th>Presyo</th><th>Stock</th><th>Aksyon</th></tr></thead><tbody id="tb"></tbody></table></div>`}
function kt(){return `<div class="flex justify-end mb-4"><button class="btn g" onclick="cform()">${ic('plus')} Magdagdag ng Kategorya</button></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${cats.map((c,i)=>`<div class="card p-5 text-center" style="background:${PAL[i%6]}33"><span class="w-20 mx-auto block flt">${mascot(c.m)}</span><h3 class="fd text-xl mt-2">${c.n}</h3><p class="font-bold text-sm">${books.filter(b=>b.c==c.n).length} libro</p><div class="flex justify-center gap-2 mt-3"><button class="ib" aria-label="I-edit" onclick="cform(${i})">${ic('pencil')}</button><button class="ib dl" aria-label="Burahin" onclick="cdel(${i})">${ic('trash-2')}</button></div></div>`).join('')}</div>`}
function ord(od){const r=od.map((o,i)=>[o,i]).filter(x=>!OF||x[0].s==OF);return `<div class="flex flex-wrap gap-2 mb-4">${['','Bago','Naipadala','Naihatid'].map(s=>`<button class="btn ${OF==s?'g':'w'}" onclick="OF='${s}';radm()">${s||'Lahat'}</button>`).join('')}</div><div class="card p-2 overflow-x-auto bg-white"><table class="w-full"><thead><tr><th>Blg.</th><th>Customer</th><th>Kabuuan</th><th>Katayuan</th><th>Baguhin</th></tr></thead><tbody>${r.map(([o,i])=>`<tr><td class="font-bold">#${o.id}</td><td>${o.c}</td><td class="font-bold">${php(o.t)}</td><td>${pill(o.s)}</td><td><select class="inp !py-1 !w-auto" aria-label="Katayuan" onchange="ost(${i},this.value);radm()">${['Bago','Naipadala','Naihatid'].map(s=>`<option ${s==o.s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=5>Walang order.</td></tr>'}</tbody></table></div>`}
function cs(){return `<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">${CU.map((c,i)=>`<div class="card p-5 flex items-center gap-4 bg-white"><span class="w-14 h-14 rounded-full border-[3px] border-[#1f2937] grid place-items-center fd text-lg shrink-0" style="background:${PAL[i%6]}">${c[0].split(' ').map(x=>x[0]).join('')}</span><div class="min-w-0"><b>${c[0]}</b><div class="text-xs opacity-70 truncate">${c[1]}</div><div class="mt-1 flex gap-2"><span class="pl2 bg-sky-100">${c[2]} order</span><span class="pl2 bg-green-100">${php(c[2]*210)}</span></div></div></div>`).join('')}</div>`}
function wb(){const c=ld('ab_content',{}),h=c.h||'Dito Nabubuhay ang mga Kuwento',b=c.b||'Magsimulang Magbasa';return `<div class="grid lg:grid-cols-2 gap-6"><div class="card p-6 grid gap-3 content-start bg-white"><h3 class="fd text-xl">I-edit ang Bahay</h3><label class="font-bold text-sm">Pangunahing Pamagat<input id="wh" class="inp mt-1" value="${h}" oninput="$('#pvh').textContent=this.value"></label><label class="font-bold text-sm">Teksto ng Pangunahing Button<input id="wc" class="inp mt-1" value="${b}" oninput="$('#pvb').textContent=this.value"></label><button class="btn g !py-3" onclick="sv('ab_content',{h:$('#wh').value,b:$('#wc').value});toast('Na-save ang nilalaman ng website!')">I-save ang mga Pagbabago</button><button class="btn w" onclick="localStorage.removeItem('ab_content');radm();toast('Naibalik sa orihinal.')">Ibalik sa Orihinal</button></div><div class="card p-6 text-center" style="background:#BAE6FD"><h3 class="fd text-xl mb-3">Paunang Tanaw</h3><div class="w-20 mx-auto flt">${mascot('frog')}</div><p id="pvh" class="fd text-3xl mt-3 text-[#153b3b]">${h}</p><span id="pvb" class="btn o mt-4">${b}</span></div></div>`}
function ost(i,s){const o=ld('ab_orders',SO);o[i].s=s;sv('ab_orders',o);toast('Na-update ang katayuan.')}
function rtb(){const q=AS.toLowerCase(),l=books.filter(b=>(!CF||b.c==CF)&&(b.t+b.a).toLowerCase().includes(q));$('#bc').textContent=l.length+' libro';
$('#tb').innerHTML=l.map(b=>`<tr><td><img src="${b.img}" alt="" class="w-9 h-12 object-cover rounded border-2 border-[#1f2937] bg-[#2D6A4F]" onerror="this.style.visibility='hidden'"></td><td class="font-bold">${b.t}</td><td>${b.a}</td><td><span class="pl2 bg-sky-100">${b.c}</span></td><td class="font-bold">${php(b.p)}</td><td><span class="pl2 ${b.s<15?'bg-red-200':'bg-green-200'}">${b.s}</span></td><td><button class="ib" aria-label="I-edit" onclick="bform(${b.id})">${ic('pencil')}</button> <button class="ib dl" aria-label="Burahin" onclick="bdel(${b.id})">${ic('trash-2')}</button></td></tr>`).join('')||'<tr><td colspan="7">Walang nakitang libro.</td></tr>';ri()}
function bform(id){const b=books.find(x=>x.id==id)||{t:'',a:'',c:cats[0]?.n,p:150,s:10,img:''};mo(`<h3 class="fd text-2xl font-extrabold mb-3">${id?'I-edit ang Libro':'Magdagdag ng Libro'}</h3><form onsubmit="bsave(event,${id||0})" class="grid gap-2"><input id="f1" class="inp" required placeholder="Pamagat" aria-label="Pamagat" value="${b.t}"><input id="f2" class="inp" required placeholder="May-akda" aria-label="May-akda" value="${b.a}"><select id="f3" class="inp" aria-label="Kategorya">${cats.map(c=>`<option ${c.n==b.c?'selected':''}>${c.n}</option>`).join('')}</select><label class="text-sm font-bold">Presyo (฿)<input id="f4" type="number" min="1" required class="inp" value="${b.p}"></label><label class="text-sm font-bold">Stock<input id="f5" type="number" min="0" required class="inp" value="${b.s}"></label><label class="text-sm font-bold">Link ng larawan ng pabalat (opsyonal)<input id="f6" class="inp" value="${b.img}"></label><button class="btn g !py-3">I-save</button></form>`)}
function bsave(e,id){e.preventDefault();const v=i=>$('#f'+i).value;
if(id){Object.assign(books.find(b=>b.id==id),{t:v(1),a:v(2),c:v(3),p:+v(4),s:+v(5),img:v(6)});toast('Na-update ang libro!')}
else{const c=cats.find(c=>c.n==v(3));books.push({id:++uid,t:v(1),a:v(2),c:v(3),p:+v(4),s:+v(5),img:v(6)||c?.img||'',ag:'Edad 4-8',r:4.5,d:'Isang bagong kuwentong hatid ng AklatBata.'});toast('Naidagdag ang bagong libro!')}
saveBooks();mc();radm()}
function bdel(id){if(confirm('Sigurado ka bang buburahin ang libro na ito?')){books=books.filter(b=>b.id!=id);delete cart[id];sv('ab_cart',cart);saveBooks();radm();toast('Nabura ang libro.')}}
function cform(i){const c=cats[i]||{n:'',m:'panda',img:''};mo(`<h3 class="fd text-2xl font-extrabold mb-3">${cats[i]?'I-edit ang Kategorya':'Magdagdag ng Kategorya'}</h3><form onsubmit="csave(event,${cats[i]?i:-1})" class="grid gap-2"><input id="f1" class="inp" required placeholder="Pangalan ng kategorya" aria-label="Pangalan" value="${c.n}"><select id="f2" class="inp" aria-label="Mascot">${[['panda','Panda'],['turtle','Pagong'],['frog','Palaka'],['crab','Alimango']].map(x=>`<option value="${x[0]}" ${x[0]==c.m?'selected':''}>${x[1]}</option>`).join('')}</select><input id="f3" class="inp" placeholder="Link ng larawan (opsyonal)" aria-label="Larawan" value="${c.img}"><button class="btn g !py-3">I-save</button></form>`)}
function csave(e,i){e.preventDefault();const n=$('#f1').value,m=$('#f2').value,img=$('#f3').value;
if(i>=0){books.forEach(b=>{if(b.c==cats[i].n)b.c=n});Object.assign(cats[i],{n,m,img});saveBooks()}else cats.push({n,m,img});
saveCats();toast('Na-save ang kategorya!');mc();radm()}
function cdel(i){if(books.some(b=>b.c==cats[i].n))return toast('May mga libro pa sa kategoryang ito.');if(confirm('Burahin ang kategoryang ito?')){cats.splice(i,1);saveCats();radm()}}
</script>
</body>
</html>
